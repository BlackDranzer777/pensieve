<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pensieve — consumer intelligence and data analytics for multilingual customer feedback."
    />
    <title>Pensieve</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong palette. Kept inline and tiny on purpose.
      (function () {
        try {
          var stored = localStorage.getItem('pensieve.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* localStorage unavailable (private mode); the default class stands. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
