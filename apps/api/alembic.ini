# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent. The database URL carries credentials,
# and this file is in source control — env.py reads it from ApiSettings (and so
# from .env or the environment) instead.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Migration filenames are prefixed with the UTC date so `ls` shows them in the
# order they were written rather than by random revision hash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

# No post_write_hooks. Both forms Alembic offers are unreliable here: ruff
# ships as a standalone binary with no console_scripts entry point, and the
# `exec` form needs an absolute path to the venv that differs per platform.
# Worse, a failing hook still writes the migration, so it fails *after* the
# side effect. `make format` and CI format these files anyway.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
