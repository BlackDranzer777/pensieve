[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pensieve"
version = "0.1.0"
description = "Consumer intelligence and data analytics platform for multilingual customer feedback"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Core runtime shared by the API and the pipelines. Heavier or optional
# concerns live in the extras below so Docker images install only what they use.
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "python-ulid>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
]
# What the API needs to read Parquet and answer analytical queries. Kept
# separate from `pipelines` because the serving image has no business carrying
# Lingua's 305 MB of bundled language models, or SciPy and scikit-learn, none
# of which the API imports. Splitting these shrinks the API image by ~460 MB.
serving = [
  "pandas>=2.2",
  "pyarrow>=16.0",
  "duckdb>=1.0",
]
pipelines = [
  "pensieve[serving]",
  "pandera>=0.20",
  "lingua-language-detector>=2.0",
  "scikit-learn>=1.5",
]
nlp = [
  "transformers>=4.41",
  "torch>=2.3",
  # XLM-RoBERTa's tokenizer is SentencePiece-based, and converting it to the
  # fast tokenizer format needs protobuf as well. Missing either one fails
  # deep inside a traceback that mentions tiktoken, which is a misleading
  # place to start debugging.
  "sentencepiece>=0.2",
  "protobuf>=4.25",
]
# PySpark 4.x requires Java 17+. Installed separately so the rest of the
# project stays usable on machines without a modern JDK.
spark = [
  "pyspark>=4.0,<4.3",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-python-dateutil",
  "pandas-stubs",
]

[tool.hatch.build.targets.wheel]
# Two source roots in one distribution: `pipelines/` keeps its name, and
# `apps/api/app` is exposed as the top-level `app` package so the API can be
# started with the conventional `uvicorn app.main:app`.
packages = ["pipelines", "apps/api/app"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/web", "data", "apps/api/migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "RUF",       # ruff-specific
  "ANN",       # missing annotations
  "T20",       # no print() in library code
  "PTH",       # prefer pathlib
  "TRY",       # exception anti-patterns
  "LOG",       # logging correctness
  "S",         # bandit security checks
  "BLE",       # blind excepts must be justified
]
ignore = [
  "ANN401",  # Allow `Any` where a typed signature is genuinely impossible
  "TRY003",  # Long messages inside raise are more useful than an exception subclass here
  "B008",    # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101), print, and omit annotations on fixtures.
"**/tests/**" = ["ANN", "T20", "SIM117", "S101"]
# Scripts are CLI entry points; printing to stdout is their job.
"scripts/**" = ["T20"]
"pipelines/jobs/**" = ["T20"]
# These two files contain non-ASCII text on purpose: real multilingual review
# templates, and deliberately malformed Unicode used to generate dirty records.
# RUF001-003 flag exactly the characters these modules exist to produce.
"pipelines/ingestion/templates.py" = ["RUF001", "RUF002", "RUF003"]
"pipelines/ingestion/generator.py" = ["RUF001", "RUF002", "RUF003"]
# text.py's regex classes and docstrings must contain the exact characters it
# exists to normalise away: full-width forms, non-breaking spaces, zero-width
# joiners. Flagging them as "ambiguous" is the rule misreading the intent.
"pipelines/transformation/text.py" = ["RUF001", "RUF002", "RUF003"]
"pipelines/tests/test_generator.py" = ["RUF001"]
# S608 flags f-string SQL. Here the interpolated values are a filesystem path
# built from settings and a module constant view name — never user input — and
# SQL has no parameter binding for table or path positions, so there is no
# safer form available. Justified inline at the call site too.
"pipelines/aggregation/engines.py" = ["S608"]
# Same justification as engines.py: every interpolated value is a filesystem
# path built from settings, and `read_parquet('<path>')` is a table position,
# which SQL cannot parameterise. This script is read-only and takes no input
# beyond two argparse choices.
"scripts/inspect_data.py" = ["S608"]
"pipelines/tests/test_text.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "pipelines"]

# ---------------------------------------------------------------------------
# MyPy — pragmatic strictness. Third-party data/ML libraries ship weak stubs,
# so they are excused explicitly rather than by disabling checks globally.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["apps/api/app", "pipelines", "scripts"]
exclude = ["apps/api/migrations/versions", "data"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "pandera.*", "lingua.*", "transformers.*", "torch.*",
  "duckdb.*", "pyspark.*", "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["apps/api/tests", "pipelines/tests"]
pythonpath = [".", "apps/api"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: tests that take more than a second",
  "spark: requires a working PySpark install and JDK 17+",
  "model: downloads or loads the real transformer model",
  "integration: exercises multiple layers end to end",
]
filterwarnings = ["error::DeprecationWarning:pipelines.*"]

[tool.coverage.run]
source = ["apps/api/app", "pipelines"]
omit = ["*/tests/*", "*/migrations/*"]
