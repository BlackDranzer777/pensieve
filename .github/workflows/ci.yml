name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI must never download the ~1.1 GB sentiment model. The lexicon backend is
  # deterministic and needs no weights, so tests stay fast and hermetic.
  PENSIEVE_SENTIMENT_BACKEND: lexicon
  PYTHONUNBUFFERED: '1'

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,pipelines,dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: MyPy
        run: mypy

      - name: Backend tests
        run: pytest apps/api/tests -v

  pipelines:
    name: Pipelines (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # `[api]` is needed as well as `[pipelines]`: the Postgres loader
        # imports `app.models` so that the schema has exactly one definition,
        # which makes SQLAlchemy a real dependency of the pipeline tests.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,pipelines,dev]"

      - name: Pipeline tests
        # `-m "not spark and not model"` keeps CI free of the JDK and the model
        # download. Those suites run locally and are documented as such.
        run: pytest pipelines/tests -v -m "not spark and not model"

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm run test

      - name: Production build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # Gated behind the three check jobs rather than run alongside them.
    # Building images for code that fails its own tests wastes several minutes
    # of runner time to produce an artifact nobody should use.
    needs: [backend, pipelines, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose file
        run: docker compose config --quiet
